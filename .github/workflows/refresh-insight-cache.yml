name: Refresh Insight Cache Monthly

on:
  schedule:
    # 매월 1일 09:00 (KST) = 매월 1일 00:00 (UTC)
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  refresh-insight-cache:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      INSIGHT_API_BASE_URL: ${{ secrets.INSIGHT_API_BASE_URL || 'https://libscope2.netlify.app/api/insight-api' }}
      INSIGHT_REFRESH_SCOPE: all
      INSIGHT_REFRESH_CONCURRENCY: 4
      INSIGHT_REFRESH_SLEEP_MS: 250
      INSIGHT_REFRESH_TIMEOUT_MS: 90000
      INSIGHT_REFRESH_MAX_ATTEMPTS: 3
      INSIGHT_REFRESH_RETRY_DELAY_MS: 1500
      INSIGHT_INCLUDE_CACHE_META: 0
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
      LLM_HARNESS_BASE_URL: ${{ secrets.LLM_HARNESS_BASE_URL || 'https://libscope2.netlify.app/api/llm-harness' }}
      LLM_REFRESH_PROVIDER: direct-openai
      LLM_SOURCE_FORCE_REFRESH: 0
      LLM_REFRESH_CONCURRENCY: 2
      LLM_REFRESH_QUALITY_RETRIES: 1
      DIRECT_OPENAI_API_KEY: ${{ secrets.DIRECT_OPENAI_API_KEY }}
      DIRECT_OPENAI_BASE_URL: ${{ secrets.DIRECT_OPENAI_BASE_URL }}
      LLM_REFRESH_EXECUTION: local
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate required configuration
        run: |
          if [ -z "$INSIGHT_API_BASE_URL" ]; then
            echo "::error::INSIGHT_API_BASE_URL is required. Set it in repository secrets (예: https://your-site.netlify.app/api/insight-api)"
            exit 1
          fi
          echo "Using insight API base URL: $INSIGHT_API_BASE_URL"

      - name: Ingest and verify latest resident population
        run: |
          node scripts/test-monthly-report.cjs
          node scripts/refresh-resident-population.cjs

      - name: Refresh insight cache
        run: npm run refresh:insight-cache

      - name: Generate and verify current month reports
        run: npm run refresh:llm-cache
